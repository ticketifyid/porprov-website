<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Status pendaftaran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EEF3FB;color:#0B1B3F}
a{color:#1F5FD6}a:hover{color:#123F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF3FB; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0B1B3F">
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 6px">
    <div style="background: #179C52"></div><div style="background: #F2B705"></div><div style="background: #D93A2B"></div><div style="background: #1F5FD6"></div>
  </div>

  <div style="padding: 20px 24px 0; display: flex; justify-content: center">
    <img src="/_blob/f962f20b004c3754fbb4c86a779ac88d" alt="Logo Porprov Jawa Tengah XVII 2026" style="width: 120px; height: auto; display: block">
  </div>

  <div style="margin: 28px 16px 0; background: #FFFFFF; border-radius: 24px; padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <div style="width: 76px; height: 76px; border-radius: 50%; background: #E6EEFC; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <sc-if value="{{isSoon}}" hint-placeholder-val="{{ false }}">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0E2A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </sc-if>
      <sc-if value="{{isClosed}}" hint-placeholder-val="{{ false }}">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0E2A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </sc-if>
      <sc-if value="{{isFull}}" hint-placeholder-val="{{ true }}">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0E2A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M15.5 14.5A5 5 0 0 1 21 20"></path></svg>
      </sc-if>
    </div>
    <h1 style="margin: 0; font-size: 25px; line-height: 1.2; font-weight: 800; color: #0E2A6B">{{title}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4B5A7A">{{body}}</p>
    <sc-if value="{{showFind}}" hint-placeholder-val="{{ true }}">
      <a href="LupaTiket.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; margin-top: 8px; border-radius: 14px; border: 1.5px solid #0E2A6B; color: #0E2A6B; font-size: 16px; font-weight: 700; text-decoration: none">Sudah mendaftar? Cari tiket saya</a>
    </sc-if>
  </div>

  <div style="margin-top: auto; padding: 20px 24px 28px; font-size: 13px; color: #4B5A7A; text-align: center">Didukung oleh <strong style="color: #0E2A6B">Ticketify</strong></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kondisi":{"editor":"enum","options":["belum dibuka","ditutup","kuota penuh"],"default":"kuota penuh","section":"Simulasi"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kondisi ?? 'kuota penuh';
    const copy = {
      'belum dibuka': {
        title: 'Pendaftaran belum dibuka',
        body: 'Pendaftaran dibuka pada [TANGGAL & JAM BUKA]. Simpan halaman ini dan kembali lagi saat pendaftaran dibuka.'
      },
      'ditutup': {
        title: 'Pendaftaran sudah ditutup',
        body: 'Terima kasih atas antusiasme Anda. Jika sudah mendaftar, e-ticket Anda tetap berlaku untuk registrasi ulang.'
      },
      'kuota penuh': {
        title: 'Kuota pendaftaran sudah penuh',
        body: 'Seluruh tiket Opening Ceremony sudah terdaftar. Jika sudah mendaftar, e-ticket Anda tetap berlaku untuk registrasi ulang.'
      }
    }[k] || { title: '', body: '' };
    return {
      title: copy.title,
      body: copy.body,
      isSoon: k === 'belum dibuka',
      isClosed: k === 'ditutup',
      isFull: k === 'kuota penuh',
      showFind: k !== 'belum dibuka'
    };
  }
}
</script>
</body>
</html>
